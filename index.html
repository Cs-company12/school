<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap">
<link rel="icon" type="image/png" href="https://github.com/Cs-company12/DOCTOR-PANAL/raw/main/11.png">
<title>Nidaamka Maamulka Akadeemiyada</title>
<style>:root{
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  /* Cagaar (default): the original blackboard green + chalk gold, refined */
  --bg:#F8F6F0;--wash:#F1EFE4;--surface:#FFFFFF;--ink:#14241E;--muted:#5F6B64;--line:#E7E3D6;--soft:#F4F2E9;--row-hover:#FBFAF5;
  --bar:#0B5E4B;--on-bar:#FFFFFF;--bar-muted:rgba(255,255,255,.76);--bar-line:transparent;--tab-line:#F2C14E;
  --primary:#0B5E4B;--primary-deep:#08443A;--primary-soft:#DFF0E7;--primary-text:#0B5E4B;--on-primary:#FFFFFF;
  --accent:#F2C14E;--on-accent:#2B2107;--accent-soft:#FDF3D6;--focus:#F2C14E;
  --p-head:#0B5E4B;--on-p-head:#FFFFFF;--p-head-sub:rgba(255,255,255,.8);--p-head-kicker:#F2C14E;--rule:rgba(255,255,255,.06);
  --sheet-head:#0B5E4B;--on-sheet-head:#FFFFFF;--sheet-sub:rgba(255,255,255,.75);--sheet-kicker:#F2C14E;--stamp:#F2C14E;--stamp-fail:#FFB4A6;--stamp-bg:rgba(255,255,255,.06);
  --meter:#0B5E4B;--pass:#1B8763;--pass-soft:#DFF2E9;--fail:#C2412D;--fail-soft:#FBE5E0;--admin-badge:#0B5E4B;
  --scrim:rgba(8,22,18,.5);--glow:rgba(11,94,75,.10);
}
:root[data-palette="pink"]{
  --bg:#FFFFFF;--wash:#FFF5F8;--surface:#FFFFFF;--ink:#2A1F2D;--muted:#7A6A77;--line:#F1E2E9;--soft:#FDF0F5;--row-hover:#FFFAFC;
  --bar:#FFFFFF;--on-bar:#2A1F2D;--bar-muted:#7A6A77;--bar-line:#F1E2E9;--tab-line:#D6457B;
  --primary:#D6457B;--primary-deep:#B7336A;--primary-soft:#FCE6EF;--primary-text:#B7336A;--on-primary:#FFFFFF;
  --accent:#D6457B;--on-accent:#FFFFFF;--accent-soft:#FCE6EF;--focus:#F6BCD1;
  --p-head:#FFF1F6;--on-p-head:#2A1F2D;--p-head-sub:#7A6A77;--p-head-kicker:#B7336A;--rule:rgba(214,69,123,.07);
  --sheet-head:#FCE6EF;--on-sheet-head:#2A1F2D;--sheet-sub:#7A6A77;--sheet-kicker:#B7336A;--stamp:#D6457B;--stamp-fail:#D9480F;--stamp-bg:rgba(255,255,255,.55);
  --meter:#D6457B;--pass:#23906E;--pass-soft:#E3F5EE;--fail:#D9480F;--fail-soft:#FFEDE3;--admin-badge:#6D4A7E;
  --scrim:rgba(42,31,45,.45);--glow:rgba(214,69,123,.10);
}
:root[data-palette="buluug"]{
  --bg:#F3F6FA;--wash:#EAF0F7;--surface:#FFFFFF;--ink:#14213A;--muted:#5B6780;--line:#DDE4EE;--soft:#EEF2F8;--row-hover:#F7F9FC;
  --bar:#17365D;--on-bar:#FFFFFF;--bar-muted:rgba(255,255,255,.74);--bar-line:transparent;--tab-line:#E9B949;
  --primary:#17365D;--primary-deep:#0F2644;--primary-soft:#DFE8F4;--primary-text:#17365D;--on-primary:#FFFFFF;
  --accent:#E9B949;--on-accent:#2A1F05;--accent-soft:#FBF1D6;--focus:#E9B949;
  --p-head:#17365D;--on-p-head:#FFFFFF;--p-head-sub:rgba(255,255,255,.78);--p-head-kicker:#E9B949;--rule:rgba(255,255,255,.06);
  --sheet-head:#17365D;--on-sheet-head:#FFFFFF;--sheet-sub:rgba(255,255,255,.75);--sheet-kicker:#E9B949;--stamp:#E9B949;--stamp-fail:#FFB4A6;--stamp-bg:rgba(255,255,255,.06);
  --meter:#17365D;--pass:#1B8763;--pass-soft:#DCF1E8;--fail:#C2412D;--fail-soft:#FBE5E0;--admin-badge:#17365D;
  --scrim:rgba(10,18,34,.5);--glow:rgba(23,54,93,.10);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
p{margin:0}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--primary-deep)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1.2 var(--body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--focus);background:var(--wash)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-deep);border-color:var(--primary-deep)}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary-deep)}
.btn.danger{color:var(--fail)}
.btn.danger-solid{background:var(--fail);border-color:var(--fail);color:#fff}
.btn.big{min-height:52px;font-size:16px;padding:12px 22px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.danger:hover{background:var(--fail-soft);color:var(--fail)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-height:42px;width:100%;max-width:100%}
input:disabled{background:var(--soft);color:var(--muted)}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.field{display:grid;gap:6px;min-width:0}
.field>span{font:600 13px/1.3 var(--body);color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:grid;gap:14px}
.form-err{color:var(--fail);font-weight:600;font-size:14px}
.hint{color:var(--muted);font-size:14px}
.bad{border-color:var(--fail)!important;background:var(--fail-soft)!important}

/* app chrome */
.bar{background:var(--bar);color:var(--on-bar);border-bottom:1px solid var(--bar-line);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bar-in{max-width:1160px;margin:0 auto;padding:14px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 16px/1 var(--display);box-shadow:0 0 0 3px var(--bar),0 0 0 4.5px var(--accent)}
.brand h1{font-weight:750;font-size:clamp(18px,3vw,23px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:13px;color:var(--bar-muted);margin-top:1px}
.me{display:flex;align-items:center;gap:8px}
.me-chip{display:flex;align-items:center;gap:9px;border:1px solid color-mix(in srgb,var(--on-bar) 22%,transparent);border-radius:99px;padding:4px 12px 4px 4px;background:color-mix(in srgb,var(--on-bar) 8%,transparent);cursor:pointer;color:var(--on-bar);text-align:left}
.me-chip:hover{border-color:var(--accent)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 13px var(--body)}
.me-chip b{display:block;font-size:13.5px;line-height:1.2;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip small{display:block;font-size:12px;color:var(--bar-muted);line-height:1.2}
.tabs{max-width:1160px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--bar-muted);padding:11px 12px 12px;font:600 14.5px var(--body);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--on-bar)}
.tab[aria-selected="true"]{color:var(--on-bar);border-bottom-color:var(--tab-line)}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 80px;display:grid;gap:18px}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head-row h2{font-size:clamp(22px,3vw,28px);font-weight:750}
.head-row p{color:var(--muted);font-size:14px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.panel.tint{background:var(--wash)}
.panel h3{font-size:18px;font-weight:700;margin-bottom:4px}
.panel-h{margin-bottom:14px}
.panel-h p{color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:36px}
.toolbar select{width:auto;flex:0 1 220px}
.spacer{flex:1}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.count{color:var(--muted);font-size:13px;margin-top:8px}
.selects{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.selects .field{flex:1 1 200px;max-width:320px}
.notice{padding:12px 16px;border-radius:12px;background:var(--primary-soft);color:var(--primary-deep);font-weight:600;font-size:14px}
.notice.warn{background:var(--fail-soft);color:var(--fail)}
.loading{padding:40px 10px;text-align:center;color:var(--muted)}

/* stats & meters */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:18px}
.stat{padding:16px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:750 clamp(24px,3.4vw,32px)/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13.5px}
.meter-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.meter-row:first-of-type{border-top:0}
.meter-row .lbl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-row .lbl small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.meter-row .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px;text-align:right}
.meter{display:block;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--primary)}
.meter.low i{background:var(--fail)}
.meter.done i{background:var(--pass)}
.top-list{list-style:none;margin:0;padding:0}
.top-list li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.top-list li:first-child{border-top:0}
.top-list .rk{font:700 14px var(--display);color:var(--primary)}
.top-list .who b{display:block;font-weight:650}
.top-list .who small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;background:var(--surface);white-space:nowrap}
.chip.pink{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.role{display:inline-block;border-radius:99px;padding:2px 9px;font:700 12px/1.5 var(--body)}
.role.admin{background:var(--admin-badge);color:#fff}
.role.teacher{background:var(--primary-soft);color:var(--primary-deep)}
.status-off{color:var(--fail);font-weight:650}
.status-on{color:var(--pass);font-weight:650}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.data th{text-align:left;font:650 12.5px/1.3 var(--body);color:var(--muted);padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.data td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.data tbody tr:last-child td{border-bottom:0}
.data tbody tr:hover td{background:var(--row-hover)}
.data .num{text-align:right}
.data .ctr{text-align:center}
.data th small{font-weight:500;opacity:.8;margin-left:2px}
.data .sticky{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
.data th.sticky{background:var(--soft)}
.who-cell b{display:block;font-weight:650;white-space:nowrap}
.who-cell small{display:block;color:var(--muted);font-size:12.5px}
.link-btn{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.link-btn:hover b{color:var(--primary-deep);text-decoration:underline;text-underline-offset:3px}
.idcell{font-weight:650}
.g{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:99px;font:700 13px/1.5 var(--body);background:var(--pass-soft);color:var(--pass)}
.g.F{background:var(--fail-soft);color:var(--fail)}
.st-ok{color:var(--pass);font-weight:650}
.st-bad{color:var(--fail);font-weight:650}
.mk{width:66px;min-height:36px;padding:6px 8px;text-align:right;border-radius:9px;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.mk.saving{border-color:var(--focus);background:var(--wash)}
.mk.saved{border-color:var(--pass);background:var(--pass-soft)}
.data td.mk-cell{padding:5px 6px;text-align:center}
.tot{font-weight:700}
.empty{display:grid;justify-items:start;gap:10px;padding:32px 24px;border:1px dashed var(--focus);border-radius:18px;background:var(--wash)}
.empty h3{font-size:20px}
.empty p{color:var(--muted);max-width:56ch}
.summary-line{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:14px}
.summary-line b{color:var(--ink)}

/* work cards (teacher) */
.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.work{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:grid;gap:10px}
.work h4{margin:0;font:700 17px/1.2 var(--display)}
.work p{color:var(--muted);font-size:13.5px}
.work .nums{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.work .nums b{color:var(--ink)}

/* settings */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:12px}
.edit-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.edit-list li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit-list li>input.nm{flex:1 1 150px;min-width:0;width:auto}
.edit-list li>input.max{flex:0 0 80px;width:80px}
.edit-list .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1;min-width:0}
.add-row input.max{flex:0 0 80px;width:80px}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:650;color:var(--muted);white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;min-height:0;padding:0;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:focus{box-shadow:0 0 0 3px var(--primary-soft)}

/* toast, modal, menu */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--fail)}
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.modal-box{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:100%;overflow:auto;border-radius:20px;padding:22px}
.modal-box.wide{max-width:820px;background:var(--wash);padding:16px}
.modal-box>h2{font-size:22px;font-weight:750;margin-bottom:12px}
.modal-box>p{color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;display:grid;gap:10px}
.sec h3{font-size:16px}
@media (min-width:640px){.modal{align-items:center}}
.menu{position:absolute;right:20px;top:62px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;display:grid;min-width:220px;z-index:30}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;font:600 14px var(--body);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--soft)}

/* auth screens */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--p-head);background-image:repeating-linear-gradient(0deg,var(--rule) 0 1px,transparent 1px 30px)}
.auth-card{width:100%;max-width:420px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.14)}
.auth-card .crest{box-shadow:none}
.auth .hint{color:var(--p-head-sub)}
.auth-card .hint{color:var(--muted)}
.auth-card .crest{margin-bottom:14px}
.auth-card h1{font-size:26px;font-weight:800}
.auth-card>p{color:var(--muted);margin:4px 0 18px}
.auth-card .form{gap:12px}
.auth-foot{margin-top:16px;text-align:center;font-size:14px}
.auth-foot button{border:0;background:none;color:var(--primary-deep);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* student portal */
.portal{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.p-head{background:var(--p-head);color:var(--on-p-head);padding:44px 20px 92px;background-image:repeating-linear-gradient(0deg,var(--rule) 0 1px,transparent 1px 30px)}
.p-in{max-width:760px;margin:0 auto}
.p-in .crest{width:56px;height:56px;font-size:20px;margin-bottom:20px;box-shadow:0 0 0 3px var(--p-head),0 0 0 4.5px var(--accent)}
.p-head h1{font-weight:800;font-size:clamp(32px,7vw,54px);line-height:1.02;letter-spacing:-.025em;max-width:16ch;color:var(--on-p-head)}
.p-tag{margin-top:10px;color:var(--p-head-sub);font-size:16px}
.p-year{margin-top:8px;color:var(--p-head-kicker);font-weight:650;font-size:14.5px}
.p-main{flex:1;width:100%;max-width:760px;margin:-58px auto 0;padding:0 16px 40px;display:grid;gap:20px;align-content:start}
.lookup{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 36px var(--glow)}
.lookup h2{font-size:22px;font-weight:750}
.lookup>p{color:var(--muted);margin-top:4px}
.lookup form{display:grid;gap:12px;margin-top:18px;grid-template-columns:1fr}
.lookup #pId{font:700 20px/1.2 var(--body);letter-spacing:.02em;min-height:56px;text-transform:uppercase}
.lookup #pId::placeholder{text-transform:none;font-weight:500;letter-spacing:0;font-size:16px;color:var(--muted)}
.lookup select{min-height:52px}
.p-err{margin-top:12px;color:var(--fail);font-weight:600}
.p-closed{margin-top:10px;padding:14px 16px;border-radius:12px;background:var(--soft)}
.p-foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 28px;display:grid;gap:4px}
.p-foot button{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}
.back-admin{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
@media (min-width:640px){.lookup form{grid-template-columns:1.3fr 1fr auto;align-items:end}}

/* report sheet */
.sheet{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow:hidden;width:100%;max-width:760px;margin:0 auto;box-shadow:0 14px 36px var(--glow)}
.sheet-head{background:var(--sheet-head);color:var(--on-sheet-head);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background-image:repeating-linear-gradient(0deg,var(--rule) 0 1px,transparent 1px 26px)}
.sheet-school{font:700 13px/1.3 var(--body);color:var(--sheet-kicker);letter-spacing:.04em;text-transform:uppercase}
.sheet-head h3{font-weight:800;font-size:clamp(21px,4.2vw,30px);line-height:1.08;margin:4px 0}
.sheet-year{font-size:13.5px;color:var(--sheet-sub)}
.stamp{flex:none;width:98px;height:98px;border-radius:50%;border:3px solid var(--stamp);outline:1.5px solid var(--stamp);outline-offset:3px;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);background:var(--stamp-bg)}
.stamp-g{font:800 40px/1 var(--display);letter-spacing:-.02em}
.stamp-l{font:700 12px/1 var(--body);margin-top:5px}
.stamp.fail{color:var(--stamp-fail);border-color:var(--stamp-fail);outline-color:var(--stamp-fail)}
.stamp-in{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) .15s both}
@keyframes stamp{from{transform:rotate(-24deg) scale(1.9);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp-in{animation:none}#toast{transition:none}}
.sheet-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0;padding:20px 24px;border-bottom:1px solid var(--line)}
.sheet-info dt{font-size:12.5px;color:var(--muted);font-weight:600}
.sheet-info dd{margin:2px 0 0;font:700 16.5px/1.25 var(--body);overflow-wrap:anywhere}
.sheet-table{padding:6px 24px 4px;overflow-x:auto}
table.marks{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.marks th{text-align:left;font:650 12.5px var(--body);color:var(--muted);padding:12px 8px 8px;border-bottom:2px solid var(--ink)}
.marks td{padding:11px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.marks tfoot th,.marks tfoot td{border-bottom:0;border-top:2px solid var(--ink);padding-top:12px;color:var(--ink);font-size:14.5px}
.marks .num{text-align:right;white-space:nowrap}
.marks b{font-size:16px}
.marks small{color:var(--muted);margin-left:1px}
.marks .subj{display:block;font-weight:650}
.marks .rmk{display:block;font-size:12.5px;color:var(--muted)}
.marks .bar-col{width:32%;min-width:80px}
.marks .meter{background:var(--soft)}
.marks .meter i{background:var(--meter)}
.marks .meter.low i{background:var(--fail)}
.sheet-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 24px 0;border:1px solid var(--line);border-radius:14px;background:var(--wash)}
.sheet-sum div{padding:12px 14px;border-left:1px solid var(--line)}
.sheet-sum div:first-child{border-left:0}
.sheet-sum span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.sheet-sum strong{display:block;font:750 18px/1.25 var(--display);margin-top:2px}
.sheet-sum .ok{color:var(--pass)}
.sheet-sum .bad{color:var(--fail)}
.sheet-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:26px 24px 22px;font-size:12.5px;color:var(--muted)}
.sheet-foot .sign{min-width:190px;border-top:1px solid var(--ink);padding-top:6px;text-align:center;color:var(--ink)}
.report-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}

@media (max-width:700px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .bar-in{padding:12px 14px 2px}
  .me-chip .me-t{display:none}
  .me-chip{padding:4px}
  .wrap{padding:18px 14px 80px}
  .toolbar select{flex:1 1 160px}
  .two{grid-template-columns:1fr}
  .meter-row{grid-template-columns:1fr auto;row-gap:6px}
  .meter-row .meter{grid-column:1/-1;grid-row:2}
  .menu{right:12px;top:58px}
}
@media (max-width:560px){
  .sheet-head{padding:18px}
  .stamp{width:78px;height:78px}
  .stamp-g{font-size:31px}
  .sheet-info,.sheet-table{padding-left:16px;padding-right:16px}
  .sheet-sum{grid-template-columns:1fr 1fr;margin:12px 16px 0}
  .sheet-sum div:nth-child(3){border-left:0}
  .sheet-sum div:nth-child(n+3){border-top:1px solid var(--line)}
  .sheet-foot{padding:22px 16px 18px}
  .marks .bar-col{display:none}
}

/* printing */
#print-root{display:none}
.print-doc .pd-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.print-doc .pd-head h1{font-size:22px}
.print-doc .pd-head p{color:var(--muted);font-size:13px;margin-top:2px}
.print-doc .pd-foot{margin-top:14px;font-size:12px;color:var(--muted)}
.print-doc table.data td,.print-doc table.data th{border-bottom:1px solid var(--line);padding:6px 8px;font-size:12px}
@media print{
  :root{padding:0}
  body{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  .sheet{border:0;border-radius:0;max-width:none}
  .no-print{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stamp-in{animation:none}
  @page{margin:12mm}
}

/* ---- boot, errors, extras ---- */
.boot{display:grid;justify-items:center;gap:14px}
.boot .crest{width:58px;height:58px;font-size:21px;box-shadow:0 0 0 3px var(--p-head),0 0 0 4.5px var(--accent)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.75}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.err-detail{margin-top:16px;font-size:12.5px;color:var(--muted)}
.err-detail summary{cursor:pointer}
.err-detail code{display:block;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--soft);white-space:pre-wrap;word-break:break-word}
.auth-card p+p{margin-top:8px}
.btn.wa{color:#0F7A5C;border-color:#BFE6D6}
.btn.wa:hover{background:#EAF8F2;border-color:#8FD3B8}
.stat{position:relative}
.stat b{color:var(--primary-text)}
.panel{box-shadow:0 1px 2px rgba(0,0,0,.03)}
.head-row h2{position:relative;padding-left:14px}
.head-row h2::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:5px;border-radius:3px;background:var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.theme-opt{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:grid;gap:4px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.theme-opt:hover{border-color:var(--focus)}
.theme-opt[aria-checked="true"]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.tp{display:grid;grid-template-rows:22px 1fr;height:84px;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.06);position:relative;margin-bottom:6px}
.tp-bar{display:flex;align-items:center;gap:6px;padding:0 8px}
.tp-dot{width:10px;height:10px;border-radius:50%}
.tp-line{width:40%;height:4px;border-radius:2px;opacity:.85}
.tp-card{margin:8px 8px 22px;background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tp-btn{position:absolute;right:10px;bottom:8px;width:34px;height:10px;border-radius:5px}
.tp-name{font-weight:700;font-size:14.5px}
.tp-note{font-size:12.5px;color:var(--muted)}
.lookup h2{color:var(--primary-text)}
.work{box-shadow:0 1px 2px rgba(0,0,0,.03)}
.work h4{color:var(--primary-text)}

/* layout refinements */
.cols{align-items:start}
.meter-row{grid-template-columns:1fr auto;row-gap:7px}
.meter-row .meter{grid-column:1/-1;grid-row:2}
.meter-row .lbl{white-space:normal}
.edit-list li.ex{padding:10px 0;border-top:1px solid var(--line);gap:10px 14px}
.edit-list li.ex:first-child{border-top:0;padding-top:0}
.edit-list li.ex>input.nm{flex:1 1 100%}
.edit-list li.ex .icon-btn{margin-left:auto}

/* ---- private-link sign-in ---- */
.key-hint{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary-deep);font-size:14px;line-height:1.5}
.key-hint b{color:var(--ink)}
.linkbox{margin-top:14px}
.linkbox input{font:600 13px/1.4 var(--body);color:var(--primary-deep);background:var(--wash);border-style:dashed;letter-spacing:0;text-overflow:ellipsis}

/* ---- username / password sign-in ---- */
.pw{position:relative;display:block}
.pw input{padding-right:78px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--primary-text);font:650 13px var(--body);padding:8px 10px;border-radius:8px;cursor:pointer}
.pw-toggle:hover{background:var(--primary-soft)}
.auth-note{margin-top:16px;text-align:center;color:var(--muted);font-size:13.5px}
.cred{display:grid;gap:10px;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--wash);border:1px dashed var(--line)}
.cred div{display:grid;gap:2px}
.cred span{font-size:12.5px;color:var(--muted);font-weight:600}
.cred b{font:700 16px/1.35 var(--body);color:var(--primary-deep);word-break:break-all}

/* ---- Kooxaha, imaansho, ogeysiisyo ---- */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.cc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cc-head h3{margin:0 auto 0 0;font-size:19px;color:var(--primary-text)}
.cs-list{list-style:none;margin:0;padding:0}
.cs-list li{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(160px,1.6fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cs-list li:first-child{border-top:0}
.cs-name{font-weight:650;overflow:hidden;text-overflow:ellipsis}
.cs-name small{color:var(--muted);font-weight:500;margin-left:2px}
.t-sel{min-height:38px;padding:6px 10px;font-size:14px}
.class-card .add-row{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.class-card .add-row select{flex:1;min-width:0}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg-b{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 14px;min-height:38px;font:650 13.5px var(--body);cursor:pointer}
.seg-b:hover{border-color:var(--focus);color:var(--ink)}
.seg-b.P.on{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.seg-b.A.on{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.seg-b.L.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.panel-h.head-inline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ann-list{list-style:none;margin:0;padding:0}

.ann-list li:first-child{border-top:0;padding-top:2px}
.ann-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ann-h b{font-size:15.5px;margin-right:auto}
.ann-b{margin:6px 0 4px;white-space:pre-wrap;color:var(--ink)}
@media (max-width:700px){
  .class-grid{grid-template-columns:1fr}
  .cs-list li{grid-template-columns:1fr auto;row-gap:6px}
  .cs-list li .t-sel{grid-column:1/-1;grid-row:2}
}

/* ---- lacagaha, faylka ardayga ---- */
.fin-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:2px 0 8px}
.fin-kpis>div{background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fin-kpis span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fin-kpis b{display:block;font:750 19px/1.25 var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.owe,.fin-kpis b.owe{color:var(--fail)}
.okbal,.fin-kpis b.okbal{color:var(--pass)}
.pay-amt{font-variant-numeric:tabular-nums;color:var(--primary-text)}
.pay-amt.void{text-decoration:line-through;color:var(--muted)}
.void-row td{opacity:.55}
.void-row td:last-child{opacity:1}
.chip.warn{background:var(--fail-soft);border-color:var(--fail-soft);color:var(--fail);font-weight:600}

.sec-seg{margin:0 0 4px}
.seg-b.N.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text)}
.pay-who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--wash);border:1px solid var(--line)}
.pay-who>div:first-child{flex:1 1 160px}
.pay-who b{display:block}
.pay-who small{color:var(--muted)}
.pw-bal{text-align:right}
.pw-bal span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pw-bal b{font:750 18px var(--display)}
.pw-bal.owe b{color:var(--fail)}
.pick-list{display:grid;gap:6px;margin-top:8px}
.pick{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.pick:hover{border-color:var(--focus);background:var(--wash)}

.pick small{color:var(--muted)}
.sp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.sp-contact{margin:10px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sp-sec h3{font-size:16px;margin-bottom:10px;color:var(--primary-text)}
.sp-exam{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sp-exam-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sp-exam-h b{margin-right:auto}
.sp-marks{display:flex;flex-wrap:wrap;gap:6px}
.sp-m{display:inline-flex;gap:8px;align-items:baseline;background:var(--wash);border-radius:10px;padding:5px 10px;font-size:13.5px}
.sp-m b{font-variant-numeric:tabular-nums}
.sp-m small{color:var(--muted);font-weight:500}
.sp-m.low{background:var(--fail-soft);color:var(--fail)}
.sheet-note{margin:14px 24px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
@media (max-width:560px){.sheet-note{margin:12px 16px 0}}

/* ===================== v6 skin: sidebar shell, cards, charts, motion ===================== */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:22px 14px 16px;background:var(--bar);color:var(--on-bar);border-right:1px solid var(--bar-line)}
.side .brand{padding:2px 8px}
.side .brand h1{white-space:normal;font-size:19px;line-height:1.15}
.side .tabs{display:flex;flex-direction:column;gap:3px;padding:0;margin:0;max-width:none;overflow:visible}

.side .tab svg{flex:none;opacity:.8}
.side .tab:hover{background:color-mix(in srgb,var(--on-bar) 9%,transparent);color:var(--on-bar)}
.side .tab[aria-selected="true"]{background:color-mix(in srgb,var(--on-bar) 16%,transparent);color:var(--on-bar);box-shadow:inset 3px 0 0 var(--tab-line)}

.side .me-chip{width:100%}
.main{min-width:0}
.wrap{max-width:1180px;padding:26px 28px 90px}
.menu{position:fixed;left:14px;bottom:78px;top:auto;right:auto;width:244px;z-index:70}
@media (max-width:959px){
  .shell{display:block}
  .side{position:sticky;top:0;z-index:30;height:auto;overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:10px 12px 0;border-right:0;border-bottom:1px solid var(--bar-line);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .side .brand{grid-column:1;grid-row:1}
  .side .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
  .side .me{grid-column:2;grid-row:1;margin:0}
  .side .me-chip{width:auto}
  .side .tabs{grid-column:1/-1;grid-row:2;flex-direction:row;overflow-x:auto;gap:2px;padding:8px 0 0;scrollbar-width:none}
  .side .tabs::-webkit-scrollbar{display:none}
  .side .tab{width:auto;flex:none;padding:10px 12px;gap:8px;border-radius:10px 10px 0 0}
  .side .tab svg{width:16px;height:16px}
  .side .tab[aria-selected="true"]{background:none;box-shadow:inset 0 -3px 0 var(--tab-line)}
  .wrap{padding:18px 14px 80px}
  .menu{left:auto;right:12px;top:58px;bottom:auto}
}

/* hero, kpis, donuts */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px 30px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--accent)));box-shadow:0 14px 34px var(--glow)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 28px);pointer-events:none}
.hero-t{position:relative;z-index:1}
.hero-k{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h2{color:#fff;font-size:clamp(24px,3.6vw,34px);margin:4px 0 6px}
.hero p:not(.hero-k){opacity:.92;font-size:15px}
.hero-art{width:min(210px,32%);flex:none;color:#fff;position:relative;z-index:1}
.hero+.head-row h2::before{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px var(--glow)}
.kpi-i{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--primary-soft);color:var(--primary-text)}
.kpi-i svg{width:23px;height:23px}
.kpi.k2 .kpi-i{background:var(--accent-soft);color:var(--ink)}
.kpi.k3 .kpi-i{background:var(--pass-soft);color:var(--pass)}

/* sign-in: split screen */

/* print: ID cards + class report cards */
.idcards{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}

function compute(examId, stu, subs) {
  var m = (MK[examId] || {})[stu.id] || {}, total = 0, max = 0, count = 0, rows = [];
  subs.forEach(function (s) {

function results(examId, classId) {

  var res = list.map(function (s) { return compute(examId, s, subjectsFor(s.class_id)); });
  var by = {};

  Object.keys(by).forEach(function (k) {
    var sc = by[k].filter(function (r) { return r.pct != null && r.complete; }).sort(function (a, b) { return b.pct - a.pct; });
    var prev = null, rank = 0;
    sc.forEach(function (r, i) { if (prev === null || Math.abs(r.pct - prev) > 1e-9) rank = i + 1; r.rank = rank; r.of = sc.length; prev = r.pct; });
  });
  var order = {}; S.classes.forEach(function (c, i) { order[c.id] = i; });
  return res.sort(function (a, b) {

    if ((a.pct == null) !== (b.pct == null)) return a.pct == null ? 1 : -1;

/* what removing a subject from a class takes with it */
function csImpact(classId, subId) {
  return { t: teachersOf(classId, subId).length, tt: S.timetable.filter(function (c) { return c.class_id === classId && c.subject_id === subId; }).length };
}
function csImpactText(im) {
  var parts = []; if (im.t) parts.push('tababaraha loo xilsaaray'); if (im.tt) parts.push(im.tt + ' xiisadood oo jadwalka ku jira');
  return parts.length ? ' Waxaa sidoo kale la tirtirayaa ' + parts.join(' iyo ') + '.' : '';
}
/* a class must keep at least one subject: a class with none configured would silently study all of them */
function csLastOne(classId) { return classSubjectList(classId).length <= 1; }
async function removeCS(classId, subId) {
  await ensureCfg(classId);
  q(await sb.from('sms_class_subjects').delete().match({ class_id: classId, subject_id: subId }));
  S.classSubjects = S.classSubjects.filter(function (x) { return !(x.class_id === classId && x.subject_id === subId); });
  S.assignments = S.assignments.filter(function (a) { return !(a.class_id === classId && a.subject_id === subId); });
  var cells = S.timetable.filter(function (c) { return c.class_id === classId && c.subject_id === subId; });
  if (cells.length) {
    S.timetable = S.timetable.filter(function (c) { return cells.indexOf(c) < 0; });
    q(await sb.from('sms_timetable').delete().match({ class_id: classId, subject_id: subId }));
  }
}
async function addCS(classId, subId) {
  await ensureCfg(classId);
  if (S.classSubjects.some(function (x) { return x.class_id === classId && x.subject_id === subId; })) return;
  var row = q(await sb.from('sms_class_subjects').insert({ class_id: classId, subject_id: subId }).select('class_id,subject_id').single());
  S.classSubjects.push(row);
}

  renderTab(); w = document.querySelector('.cs-matrix .table-wrap'); if (w) w.scrollLeft = sl; window.scrollTo(0, y);

function curriculumMatrix() {
  var h = '<section class="panel cs-matrix"><div class="panel-h"><h3>Maaddooyinka koox kasta</h3><p>Calaamadee maaddooyinka koox kasta dhigto. Koox aan weli la dejin wuxuu dhigtaa dhammaan maaddooyinka. Marka maaddo koox laga saaro, tababaraha iyo xiisadaha jadwalka ee maaddadaas kooxdaas waa la tirtirayaa; dhibcihii hore waa sii jiraan.</p></div>';

    return '<th class="cs-col"><span class="cs-sub">' + esc(s.name) + '</span><span class="cs-colbtns"><button class="mini-btn" data-act="cs-col" data-mode="all" data-sub="' + esc(s.id) + '" title="Ku dar dhammaan kooxaha" aria-label="' + esc(s.name) + ': ku dar dhammaan kooxaha">+</button><button class="mini-btn" data-act="cs-col" data-mode="none" data-sub="' + esc(s.id) + '" title="Ka saar dhammaan kooxaha" aria-label="' + esc(s.name) + ': ka saar dhammaan kooxaha">−</button></span></th>';
  }).join('') + '<th class="num"><span class="sr">Ficillo</span></th></tr></thead><tbody>' + S.classes.map(function (c) {
    var cfg = classHasCfg(c.id), inC = {}; classSubjectList(c.id).forEach(function (s) { inC[s.id] = 1; });
    return '<tr><th class="sticky cs-class" scope="row"><b>' + esc(c.name) + '</b><small>' + (cfg ? Object.keys(inC).length + ' / ' + S.subjects.length + ' maaddo' : 'Dhammaan (weli lama dejin)') + '</small></th>' + S.subjects.map(function (s) {
      return '<td class="cs-cell"><input type="checkbox" data-cs="1" data-class="' + esc(c.id) + '" data-sub="' + esc(s.id) + '" aria-label="' + esc(s.name) + ', ' + esc(c.name) + '"' + (inC[s.id] ? ' checked' : '') + '></td>';
    }).join('') + '<td class="num"><button class="btn sm" data-act="cs-row" data-mode="all" data-class="' + esc(c.id) + '"' + (cfg && Object.keys(inC).length === S.subjects.length ? ' disabled' : '') + '>Dhammaan</button></td></tr>';
  }).join('') + '</tbody></table></div></section>';

async function toggleCS(classId, subId, on, el) {
  if (el) el.disabled = true;
  try {
    if (on) { await addCS(classId, subId); rerenderKeep(); toast(subjectName(subId) + ' waa lagu daray ' + className(classId) + '.'); return; }
    if (csLastOne(classId)) { if (el) el.checked = true; toast('Koox waa inuu leeyahay ugu yaraan hal maaddo.', true); return; }
    var im = csImpact(classId, subId);
    if (im.t || im.tt) {
      var ok = await confirmBox('Ka saar ' + subjectName(subId) + ' ' + className(classId) + '?', 'Maaddadan waa laga saarayaa kooxdan.' + csImpactText(im) + ' Dhibcihii hore waa sii jiraan.', 'Haa, ka saar');
      if (!ok) { if (el) el.checked = true; return; }
    }
    await removeCS(classId, subId); rerenderKeep(); toast(subjectName(subId) + ' waa laga saaray ' + className(classId) + '.');
  } catch (e) { if (el) el.checked = !on; toast(errMsg(e), true); rerenderKeep(); }
  finally { if (el) el.disabled = false; }
}
async function setClassSubjects(classId, all) {
  try {
    if (all) { for (var k = 0; k < S.subjects.length; k++) await addCS(classId, S.subjects[k].id); }
    rerenderKeep(); toast(className(classId) + ': dhammaan maaddooyinka waa lagu daray.');
  } catch (e) { toast(errMsg(e), true); rerenderKeep(); }
}
async function setSubjectClasses(subId, all) {
  try {
    if (all) {
      var n = 0; for (var i = 0; i < S.classes.length; i++) { if (!classSubjectList(S.classes[i].id).some(function (s) { return s.id === subId; })) { await addCS(S.classes[i].id, subId); n++; } }
      rerenderKeep(); toast(n ? subjectName(subId) + ' waa lagu daray ' + n + ' koox.' : 'Koox walba horey ayuu u dhigan jiray.'); return;
    }
    var targets = S.classes.filter(function (c) { return classSubjectList(c.id).some(function (s) { return s.id === subId; }); });
    var skip = targets.filter(function (c) { return csLastOne(c.id); }), go = targets.filter(function (c) { return skip.indexOf(c) < 0; });
    if (!go.length) { toast(skip.length ? 'Lama saari karo: koox walba waa inuu hayaa ugu yaraan hal maaddo.' : 'Koox midna ma dhigto maaddadan.', true); return; }
    var tt = 0, tc = 0; go.forEach(function (c) { var im = csImpact(c.id, subId); tt += im.tt; tc += im.t; });
    var ok = await confirmBox('Ka saar ' + subjectName(subId) + ' ' + go.length + ' koox?', 'Maaddadan waa laga saarayaa ' + go.length + ' koox.' + (tc ? ' ' + tc + ' xil tababare ayaa la tirtirayaa.' : '') + (tt ? ' ' + tt + ' xiisadood oo jadwalka ah ayaa la tirtirayaa.' : '') + (skip.length ? ' ' + skip.length + ' koox looma saarayo sababtoo ah waa tan ugu dambeysa ee ay dhigtaan.' : '') + ' Dhibcihii hore waa sii jiraan.', 'Haa, ka saar');
    if (!ok) return;
    for (var j = 0; j < go.length; j++) await removeCS(go[j].id, subId);
    rerenderKeep(); toast(subjectName(subId) + ' waa laga saaray ' + go.length + ' koox.');
  } catch (e) { toast(errMsg(e), true); rerenderKeep(); }
}

/* ================= Lacagaha: student fees + staff pay ================= */
var METHODS = { cash: 'Kaash', evc: 'EVC Plus', edahab: 'eDahab', bank: 'Bangi', other: 'Kale' };
function cur() { return (S.settings && S.settings.currency) || '$'; }

  return (n < -0.004 ? '-' : '') + cur() + s;
}
function num(v) { var x = parseFloat(String(v == null ? '' : v).replace(/,/g, '.').replace(/[^0-9.\-]/g, '')); return isFinite(x) ? x : NaN; }
function monthStart() { return todayStr().slice(0, 7) + '-01'; }
function monthIdx(ds) { var p = String(ds || '').slice(0, 10).split('-'); return p.length < 2 ? NaN : (+p[0]) * 12 + (+p[1]) - 1; }

}
var FM = null;
function indexFin() {

  S.feeAccounts.forEach(function (a) { FM.acc[a.student_id] = a; });
  S.payments.forEach(function (p) { if (!p.voided) FM.paid[p.student_id] = (FM.paid[p.student_id] || 0) + Number(p.amount); });

function ttShuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    case 'add-assign': addAssign(id, b); break;
    case 'del-assign': delAssign(id); break;
    case 'del-user': closeModal(); delUser(id); break;
    case 'add-item': addItem(b.dataset.kind, b); break;
    case 'type-add': typeAdd(b.dataset.kind, b); break;
    case 'type-del': typeDel(id); break;
    case 'cs-row': setClassSubjects(b.dataset.class, b.dataset.mode === 'all'); break;
    case 'cs-col': setSubjectClasses(b.dataset.sub, b.dataset.mode === 'all'); break;
    case 'del-item': delItem(b.dataset.kind, id); break;
  }
});
function lPrint() {
  var sec = ui.lSec || 'ardayda';
  if (sec === 'kharash') { if (!expRows().length) { toast('Wax la daabaco ma jiro.', true); return; } printDoc('Kharashaadka', ui.lFrom + ' ilaa ' + ui.lTo, finExpensesTable(true)); return; }
  if (sec === 'warbixin') { printDoc('Warbixinta lacagaha', dateSo(new Date()), finSummaryTable()); return; }
  if (sec === 'rasiidyo') { if (!rcRows().length) { toast('Wax la daabaco ma jiro.', true); return; } printDoc('Rasiidyada lacagta', ui.lFrom + ' ilaa ' + ui.lTo, finReceiptsTable(true)); }
  else if (sec === 'mushahar') printDoc('Mushaharka shaqaalaha', dateSo(new Date()), finSalaryTable(true));
  else { if (!finRows().length) { toast('Wax la daabaco ma jiro.', true); return; } printDoc('Lacagaha ardayda' + (ui.lClass ? ': ' + className(ui.lClass) : ''), dateSo(new Date()), finStudentsTable(true)); }
}
function lCsv() {
  var sec = ui.lSec || 'ardayda', rows;
  if (sec === 'kharash') rows = [['Taariikh', 'Nooca', 'Faahfaahin', 'Lacag', 'Xaalad']].concat(expRows().map(function (e) { return [String(e.spent_on).slice(0, 10), e.category, e.note || '', e.amount, e.voided ? 'La tirtiray' : 'Sax']; }));
  else if (sec === 'warbixin') rows = [['Bisha', 'Khidmad', 'Mushahar', 'Kharash', 'Hadhay']].concat(monthlySummary(6).map(function (o) { return [o.key, o.fees, o.sal, o.exp, o.net]; }));
  else if (sec === 'rasiidyo') rows = [['Rasiid', 'Taariikh', 'Arday', 'ID', 'Kooxda', 'Qaabka', 'Lacag', 'Xaalad']].concat(rcRows().map(function (p) { var st = byId(S.students, p.student_id) || {}; return [rcNo(p), String(p.paid_on).slice(0, 10), st.full_name || '', st.student_code || '', className(st.class_id), METHODS[p.method], p.amount, p.voided ? 'La tirtiray' : 'Sax']; }));
  else if (sec === 'mushahar') rows = [['Shaqaale', 'Doorka', 'Bishii', 'La rabo', 'La bixiyay', 'Hadhay']].concat(S.profiles.filter(function (p) { return p.active; }).map(function (p) { var f = salaryOf(p.id); return [p.full_name, roleLabel(p.role), f.salary, f.due, f.paid, f.balance]; }));
  else rows = [['ID', 'Arday', 'Kooxda', 'Bishii', 'La rabo', 'La bixiyay', 'Hadhay']].concat(finRows().map(function (r) { return [r.s.student_code, r.s.full_name, className(r.s.class_id), r.f.per, r.f.due, r.f.paid, r.f.balance]; }));
  deliver('Lacagaha-' + sec + '.csv', toCSV(rows));
}
function printDoc(title, sub, tableHTML) {
  var sch = school();
  printHTML('<div class="print-doc"><div class="pd-head"><h1>' + esc(sch.name) + '</h1><p>' + esc(title) + '</p><p>Sanad tababarka ' + esc(sch.year) + ', ' + esc(sub) + '</p></div>' + tableHTML + '<p class="pd-foot">La soo saaray ' + dateSo(new Date()) + '</p></div>');
}
function studentsPDF() {
  var list = filteredStudents(); if (!list.length) { toast('Liisku waa madhan yahay.', true); return; }
  var sch = school();
  return withPDF(async function (J) {
    var doc = new J({ unit: 'mm', format: 'a4' });
    pdfBand(doc, sch, 'Liiska ardayda' + (ui.fClass ? ': ' + className(ui.fClass) : ''), 'Sanad tababarka ' + sch.year + '   |   ' + list.length + ' arday');
    doc.autoTable(Object.assign({}, TSTYLE, { startY: 38, head: [['#', 'ID', 'Magaca', 'Kooxda', 'Jinsiga', 'Tel. waalidka']],
      body: list.map(function (s, i) { return [i + 1, s.student_code, s.full_name, className(s.class_id), genderTxt(s.gender), s.parent_phone || '–']; }) }));
    pdfFoot(doc, sch);
    deliver('Liiska-ardayda.pdf', doc.output('blob'));
  });
}
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { ui.q = t.value; renderStudentsTable(); return; }
  if (t.id === 'lQ') { ui.lQ = t.value; renderFinTable(); return; }
  if (t.id === 'nQ') { ui.nQ = t.value; renderIncTable(); return; }
  if (t.classList && t.classList.contains('mk')) { onMarkInput(t); return; }
});
document.addEventListener('focusout', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('mk') && saveTimers[markKey(t)]) saveMark(t);
  if (t.dataset && t.dataset.edit && t.type !== 'checkbox') listEdit(t);
  if (t.dataset && t.dataset.tid && t.tagName === 'INPUT' && t.type !== 'checkbox') typeEdit(t);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'fClass') { ui.fClass = t.value; renderStudentsTable(); return; }
  if (t.id === 'gExam') { ui.gExam = t.value; renderTab(); return; }
  if (t.id === 'mExam') { flushMarks(); ui.mExam = t.value; renderTab(); return; }
  if (t.id === 'mClass') { flushMarks(); ui.mClass = t.value; renderTab(); return; }
  if (t.id === 'rExam') { ui.rExam = t.value; renderTab(); return; }
  if (t.id === 'rClass') { ui.rClass = t.value; renderTab(); return; }
  if (t.id === 'uExam') { ui.uExam = t.value; renderTab(); return; }
  if (t.id === 'asClass') { var asSel = document.getElementById('asSub'); if (asSel) asSel.innerHTML = opts(classSubjectList(t.value), ''); return; }
  if (t.classList && t.classList.contains('t-sel')) { setTeacher(t.dataset.class, t.dataset.sub, t.value); return; }
  if (t.id === 'aClass') { ui.aClass = t.value; renderAttBody(); return; }
  if (t.id === 'showLeft') { ui.showLeft = t.checked; if (ui.tab === 'ardayda') renderStudentsTable(); else renderFinTable(); return; }
  if (t.id === 'lClass') { ui.lClass = t.value; renderFinTable(); return; }
  if (t.id === 'tClass') { ui.tClass = t.value; renderTab(); return; }
  if (t.id === 'tTeach') { ui.tTeach = t.value; renderTab(); return; }
  if (t.classList && t.classList.contains('tt-sel')) { ttSave(t); return; }
  if (t.id === 'ttPeriods') { ttSaveCfg({ timetable_periods: +t.value }); return; }
  if (t.classList && t.classList.contains('tt-time')) { var arr = []; document.querySelectorAll('.tt-time').forEach(function (i) { arr[+i.dataset.p - 1] = i.value.trim(); }); ttSaveCfg({ period_times: arr }); return; }
  if (t.id === 'nClass') { ui.nClass = t.value; renderIncTable(); return; }
  if (t.id === 'nPer') { ui.nPer = t.value; renderIncTable(); return; }
  if (t.id === 'nCat') { ui.nCat = t.value; renderIncTable(); return; }
  if (t.id === 'nSt') { ui.nSt = t.value; renderIncTable(); return; }
  if (t.id === 'lSt') { ui.lSt = t.value; renderFinTable(); return; }
  if (t.id === 'lFrom' || t.id === 'lTo' || t.id === 'lMethod') { ui[t.id] = t.value; renderFinTable(); return; }
  if (t.id === 'aDate') {
    var nd = t.value; if (!nd || nd > todayStr()) { t.value = ui.aDate; return; }
    ui.aDate = nd;
    loadAtt(nd).then(renderAttBody).catch(function (er) { toast(errMsg(er), true); });
    return;
  }
  if (t.id === 'pExam') { portal.exam = t.value; return; }
  if (t.dataset && t.dataset.edit && t.type === 'checkbox') { listEdit(t); return; }
  if (t.dataset && t.dataset.tid && (t.type === 'checkbox' || t.tagName === 'SELECT')) { typeEdit(t); return; }
  if (t.dataset && t.dataset.cs && t.type === 'checkbox') { toggleCS(t.dataset.class, t.dataset.sub, t.checked, t); return; }
});
document.addEventListener('submit', function (e) {
  var id = e.target.id;
  if (id === 'lookupForm') { e.preventDefault(); lookup(); }
  else if (id === 'loginForm') { e.preventDefault(); doLogin(e.target); }
  else if (id === 'setupForm') { e.preventDefault(); doSetup(e.target); }
  else if (id === 'setForm') { e.preventDefault(); saveSettings(e.target); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (modalEl) { if (!modalEl.__sticky) closeModal(); return; } var mm = document.getElementById('meMenu'); if (mm) mm.remove(); }
  var t = e.target;
  if (t.classList && t.classList.contains('mk')) {
    var r = +t.dataset.r, c = +t.dataset.c, nr = null;
    if (e.key === 'Enter' || e.key === 'ArrowDown') nr = r + 1; else if (e.key === 'ArrowUp') nr = r - 1;
    if (nr == null) return;
    e.preventDefault();
    var nx = document.querySelector('.mk[data-r="' + nr + '"][data-c="' + c + '"]');
    if (!nx && e.key === 'Enter') nx = document.querySelector('.mk[data-r="0"][data-c="' + (c + 1) + '"]');
    if (nx) { nx.focus(); nx.select(); }
  }
  if (t.dataset && t.dataset.tid && t.tagName === 'INPUT' && t.type !== 'checkbox' && e.key === 'Enter') { e.preventDefault(); t.blur(); }
  if ((t.id === 'new_offense' || t.id === 'new_sanction') && e.key === 'Enter') {
    e.preventDefault();
    var tb = document.querySelector('[data-act="type-add"][data-kind="' + t.id.slice(4) + '"]'); if (tb) tb.click();
    return;
  }
  if (t.id && t.id.indexOf('new_') === 0 && e.key === 'Enter') {
    e.preventDefault();
    var kind = t.id === 'new_max' ? 'sms_subjects' : t.id.slice(4);
    var btn = document.querySelector('[data-act="add-item"][data-kind="' + kind + '"]'); if (btn) btn.click();
  }
  if (t.dataset && t.dataset.edit && t.type !== 'checkbox' && e.key === 'Enter') { e.preventDefault(); t.blur(); }
});
window.addEventListener('beforeunload', function () { flushMarks(); });

boot();
})();
</script>
</body>
</html>
